name: Build and Release PatchPlugin

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  PROJECT_NAME: PatchPlugin
  CONFIGURATION: Release

permissions:
  contents: write

jobs:
  build_and_release:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build x86 (Win32)
      # Build specifically for Win32 Platform
      run: msbuild PatchPlugin.vcxproj /p:Configuration=${{env.CONFIGURATION}} /p:Platform=Win32

    - name: Build x64
      # Build specifically for x64 Platform
      run: msbuild PatchPlugin.vcxproj /p:Configuration=${{env.CONFIGURATION}} /p:Platform=x64

    # Locate and rename/prepare artifacts if necessary, or just upload them
    # Based on standard output:
    # Win32 -> Release/PatchPlugin.dp32
    # x64   -> x64/Release/PatchPlugin.dp64

    - name: List Output Files (Debugging)
      run: |
        echo "Listing Release folder:"
        if (Test-Path Release) { dir Release }
        echo "Listing x64/Release folder:"
        if (Test-Path x64/Release) { dir x64/Release }

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: PatchPlugins
        path: |
          Release/*.dp32
          Release/*.pdb
          x64/Release/*.dp64
          x64/Release/*.pdb

    - name: Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          Release/*.dp32
          x64/Release/*.dp64
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
